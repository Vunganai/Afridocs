name: CD

# Publish images to GHCR after CI succeeds on main (or run manually).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names (GHCR requires lowercase owner)
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "api=${REGISTRY}/${owner}/afridocs-api" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${owner}/afridocs-frontend" >> "$GITHUB_OUTPUT"
          echo "full=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API (also used by worker and beat)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.api }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.web }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
