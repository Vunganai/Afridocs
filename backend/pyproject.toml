[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "afridocs-api"
version = "0.1.0"
description = "AfriDocs AI — Invoice Processing Backend API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",

    # Supabase
    "supabase==2.5.0",

    # Auth / JWT
    "PyJWT[crypto]==2.8.0",
    "passlib[bcrypt]==1.7.4",

    # Validation
    "pydantic==2.7.3",
    "pydantic-settings==2.3.1",
    "email-validator==2.1.1",

    # Async task queue
    "celery==5.4.0",
    "redis==5.0.4",
    "kombu==5.3.5",

    # Azure AI Document Intelligence
    "azure-ai-documentintelligence==1.0.0",
    "azure-core==1.30.1",

    # Azure OpenAI
    "openai==1.30.1",

    # Azure Blob Storage
    "azure-storage-blob==12.20.0",

    # File handling / security
    "python-magic==0.4.27",
    "aiofiles==23.2.1",

    # HTTP client
    "httpx==0.27.0",

    # Utilities
    "structlog==24.2.0",
    "tenacity==8.3.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.8",
    "mypy==1.10.0",
    "factory-boy==3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N806", "SIM105", "B904", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
