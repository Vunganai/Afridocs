# AfriDocs — run pre-built images from GitHub Container Registry
# (local docker-compose.yml is unchanged and still builds from source.)
#
#   cp .env.example .env   # fill real values
#   export AFRIDOCS_TAG=<git-sha-or-latest>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#
# REDIS_URL in .env must be redis://redis:6379/0 (service name on this network).

name: afridocs-prod

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/${GHCR_OWNER:-vunganai}/afridocs-api:${AFRIDOCS_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/${GHCR_OWNER:-vunganai}/afridocs-api:${AFRIDOCS_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -Q documents

  beat:
    image: ghcr.io/${GHCR_OWNER:-vunganai}/afridocs-api:${AFRIDOCS_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app beat --loglevel=info

  frontend:
    image: ghcr.io/${GHCR_OWNER:-vunganai}/afridocs-frontend:${AFRIDOCS_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  redis_data:
  uploads_data:
